{% extends 'base.html' %}
{% block title %}Delete person | People{% endblock %}
{% block page_content %}
<a class="back-link" href="/"><i data-lucide="arrow-left"></i><span>Back to directory</span></a>
<section class="confirm-panel" aria-label="Confirm deletion">
    <span class="confirm-mark"><i data-lucide="triangle-alert"></i></span>
    <p class="eyebrow">Delete contact</p>
    <h1>Remove this person?</h1>
    <p>This action permanently removes the contact record from your directory.</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="button button-danger"><i data-lucide="trash-2"></i><span>Delete person</span></button>
        <a class="button button-secondary" href="/">Keep person</a>
    </form>
</section>
{% endblock %}
