{% extends 'base.html' %}
{% block title %}Add person | People{% endblock %}
{% block page_content %}
<a class="back-link" href="/"><i data-lucide="arrow-left"></i><span>Back to directory</span></a>
<header class="page-header"><div><p class="eyebrow">New contact</p><h1>Add a person</h1><p class="page-subtitle">Create a contact record for your directory.</p></div></header>
<section class="form-panel" aria-label="Add person form">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="button"><i data-lucide="check"></i><span>Save person</span></button>
            <a class="button button-secondary" href="/">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
